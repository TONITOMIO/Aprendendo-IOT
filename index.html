<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Duo — Aprenda Internet das Coisas</title>
<style>
  :root{ --green:#58cc02; --green-dark:#58a700; --blue:#1cb0f6; --blue-dark:#1899d6; --red:#ff4b4b; --yellow:#ffc800; --gray:#e5e5e5; --bg:#fff; --text:#3c3c3c; --purple:#ce82ff; --orange:#ff9600; }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Nunito',sans-serif}
  body{background:var(--bg);color:var(--text);max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .topbar{display:flex;justify-content:space-between;padding:12px;border-bottom:2px solid var(--gray);background:#fff;z-index:10}
  .stat{display:flex;gap:4px;font-weight:800;font-size:18px} .stat.streak{color:var(--orange)} .stat.gems{color:var(--blue)} .stat.hearts{color:var(--red)} .stat.xp{color:var(--yellow)}
  .screen{display:none;flex:1;padding:20px;flex-direction:column} .screen.active{display:flex}
  .module{background:#fff;border:2px solid var(--gray);border-radius:16px;padding:16px;margin-bottom:14px;display:flex;gap:14px;cursor:pointer}
  .mod-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px}
  .lesson-header{display:flex;align-items:center;gap:12px;margin-bottom:20px} .lesson-bar{flex:1;height:14px;background:var(--gray);border-radius:7px;overflow:hidden} .lesson-bar > div{height:100%;background:var(--green);transition:.3s}
  .q-text{font-size:20px;font-weight:800;margin-bottom:20px} .options{display:flex;flex-direction:column;gap:12px}
  .opt{background:#fff;border:2px solid var(--gray);border-bottom-width:4px;border-radius:14px;padding:16px;font-size:16px;font-weight:700;text-align:left;cursor:pointer}
  .opt.correct{background:#d7ffb8;border-color:var(--green)} .opt.wrong{background:#ffdfe0;border-color:var(--red)}
  .q-image{background:#f7f7f7;border-radius:16px;padding:16px;margin-bottom:20px;display:flex;justify-content:center;min-height:160px;border:1px solid #e0e0e0}
  .q-image svg{max-width:100%;max-height:220px}
  .btn{width:100%;background:var(--green);color:#fff;border:none;border-bottom:4px solid var(--green-dark);border-radius:14px;padding:16px;font-size:17px;font-weight:800;cursor:pointer;margin-top:20px}
  .feedback{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;padding:16px;background:#d7ffb8;display:none;z-index:20} .feedback.show{display:block} .feedback.wrong{background:#ffdfe0}
  .dashboard-btn{position:fixed;bottom:20px;left:20px;background:var(--blue);color:#fff;border:none;width:60px;height:60px;border-radius:50%;font-size:24px;cursor:pointer;z-index:15}
  .review-badge{position:fixed;bottom:20px;right:20px;background:var(--orange);color:#fff;border:none;width:60px;height:60px;border-radius:50%;font-size:24px;cursor:pointer;z-index:15}
  .circuit-screen{padding:16px;display:flex;flex-direction:column;height:calc(100vh - 60px)}
  .toolbox{display:flex;gap:8px;overflow-x:auto;padding:8px 0;border-bottom:2px solid var(--gray)}
  .tool-item{display:flex;flex-direction:column;align-items:center;padding:8px;border:2px solid var(--gray);border-radius:12px;cursor:grab}
  .canvas{flex:1;background:radial-gradient(circle, #e5e5e5 1px, transparent 1px) 0 0 / 20px 20px, #fafafa;border:2px dashed var(--gray);border-radius:12px;position:relative;overflow:hidden;touch-action:none}
  .placed{position:absolute;background:#fff;border:2px solid var(--gray);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;cursor:move;z-index:2}
  .pin{width:14px;height:14px;border-radius:50%;background:#ccc;border:2px solid #999;cursor:crosshair;margin:2px} .pin.connected{background:var(--green)}
  .wires-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1} .wire{stroke:var(--red);stroke-width:3;fill:none}
  body.dark{--bg:#1a1a1a;--text:#f0f0f0;--gray:#3a3a3a} body.dark .topbar, body.dark .module, body.dark .opt, body.dark .q-image, body.dark .placed {background:#2a2a2a;border-color:#3a3a3a} body.dark .canvas{background:radial-gradient(circle, #333 1px, transparent 1px) 0 0 / 20px 20px, #1e1e1e}
</style>
</head>
<body>
<div class="topbar">
  <div class="stat streak">🔥<span id="streak">0</span></div>
  <div class="stat gems">💎<span id="gems">0</span></div>
  <div class="stat hearts">❤️<span id="hearts">5</span></div>
  <div class="stat xp">⚡<span id="xp">0</span></div>
</div>
<div id="home" class="screen active">
  <h1 style="font-weight:900;margin-bottom:20px">Aprenda IoT 🚀</h1>
  <div id="modules-list"></div>
</div>
<div id="lesson" class="screen">
  <div class="lesson-header"><button class="back-btn" onclick="goHome()" style="border:none;background:none;font-size:20px;cursor:pointer">✕</button><div class="lesson-bar"><div id="lesson-progress" style="width:0%"></div></div></div>
  <div class="question-card"></div>
</div>
<div class="feedback" id="feedback"><h4 id="fb-title">Muito bem!</h4><p id="fb-text"></p><button class="btn" onclick="nextQuestion()">CONTINUAR</button></div>
<button class="dashboard-btn" onclick="openChallenges()">🎮</button>
<button class="review-badge" onclick="openReview()">🧠</button>
<div id="review" class="screen"><button onclick="goHome()" style="border:none;background:none;font-size:20px;cursor:pointer;text-align:left">←</button><h2 style="font-weight:900;margin-bottom:20px">Caderno de Erros</h2><div id="review-list"></div></div>
<div id="challenges" class="screen"><button onclick="goHome()" style="border:none;background:none;font-size:20px;cursor:pointer;text-align:left">←</button><h2 style="font-weight:900;margin-bottom:20px">Desafios de Circuito</h2><div class="module" onclick="startChallenge('led')"><div class="mod-icon" style="background:#58cc0222;color:#58cc02">💡</div><div><h3>Acender um LED</h3><p>Monte o circuito no ESP32</p></div></div></div>
<div id="circuit-editor" class="screen circuit-screen">
  <div class="lesson-header"><button onclick="goHome()" style="border:none;background:none;font-size:20px;cursor:pointer">←</button><h3 style="font-weight:900" id="circuit-title">Desafio</h3></div>
  <div class="toolbox" id="toolbox"></div>
  <div class="canvas" id="canvas"><svg class="wires-svg" id="wires-svg"></svg></div>
  <button class="btn" onclick="validateCircuit()">VERIFICAR ✓</button>
</div>
<script>
const MODULES = [
  { id: 1, title: "Fundamentos", icon: "🌐", color: "#1cb0f6", questions: [
    { q: "Quem criou o termo IoT?", o: ["Kevin Ashton", "Steve Jobs", "Bill Gates"], a: 0, td: { c: "IoT nasceu no MIT.", e: "Kevin Ashton em 1999." } },
    { q: "O que significa IoT?", o: ["Internet of Things", "Internet of Tech", "Interconnected Objects"], a: 0, td: { c: "Sigla em inglês.", e: "Internet das Coisas." } },
    { q: "Principal objetivo da IoT?", o: ["Conectar objetos à internet", "Criar redes sociais", "Substituir a web"], a: 0, td: { c: "Troca de dados.", e: "Objetos físicos na rede." } },
    { q: "Qual a camada mais baixa da arquitetura IoT?", o: ["Percepção", "Aplicação", "Rede"], a: 0, td: { c: "Toca o mundo físico.", e: "Sensores e atuadores." } },
    { q: "Onde processar para latência zero?", o: ["Edge", "Cloud", "Fog"], a: 0, td: { c: "Na borda.", e: "Processamento local." } },
    { q: "O que é Fog Computing?", o: ["Nível intermediário", "A nuvem", "O sensor"], a: 0, td: { c: "Névoa.", e: "Entre o edge e a cloud." } }
  ]},
  { id: 2, title: "Comunicação", icon: "📡", color: "#58cc02", questions: [
    { q: "Tecnologia de 10km e baixo consumo?", o: ["LoRa", "WiFi", "Bluetooth"], a: 0, td: { c: "Longo alcance.", e: "LoRa usa rádio sub-GHz." } },
    { q: "O que é Zigbee?", o: ["Rede em malha de baixo consumo", "WiFi rápido", "Rede celular"], a: 0, td: { c: "Mesh network.", e: "Dispositivos se conectam entre si." } },
    { q: "O que NÃO é rede IoT?", o: ["HTML5", "NB-IoT", "SigFox"], a: 0, td: { c: "HTML5 é web.", e: "Não é protocolo de rádio." } }
  ]},
  { id: 3, title: "Protocolos", icon: "🔌", color: "#ff9600", questions: [
    { q: "Modelo do MQTT?", o: ["Publish/Subscribe", "Cliente/Servidor", "Broadcast"], a: 0, td: { c: "Pub/Sub via Broker.", e: "Desacopla emissor e receptor." } },
    { q: "O que QoS 0 significa?", o: ["No máximo 1 vez", "Exatamente 1 vez", "Pelo menos 1 vez"], a: 0, td: { c: "Fire and forget.", e: "Envia e esquece." } },
    { q: "Protocolo para dispositivos restritos (UDP)?", o: ["CoAP", "HTTP", "MQTT"], a: 0, td: { c: "Constrained.", e: "Usa UDP e REST." } }
  ]},
  { id: 4, title: "Segurança", icon: "🔒", color: "#ff4b4b", questions: [
    { q: "Garante sigilo dos dados?", o: ["Confidencialidade", "Integridade", "Disponibilidade"], a: 0, td: { c: "Pilar CIDA.", e: "Só quem pode vê." } },
    { q: "Ataque que intercepta dados?", o: ["Man-in-the-Middle", "Phishing", "DDoS"], a: 0, td: { c: "Atacante no meio.", e: "Lê e altera tráfego." } },
    { q: "Maior falha em IoT?", o: ["Senhas padrão", "Wi-Fi fraco", "Uso de nuvem"], a: 0, td: { c: "admin/admin.", e: "Fácil de invadir." } }
  ]},
  { id: 5, title: "Hardware", icon: "🔧", color: "#1cb0f6", questions: [
    { q: "Chip do ESP32?", o: ["Xtensa LX6", "ARM Cortex", "Intel Core"], a: 0, td: { c: "Dual-core.", e: "Tensilica Xtensa." } },
    { q: "ESP32 tem Bluetooth?", o: ["Sim", "Não", "Só com módulo"], a: 0, td: { c: "Nativo.", e: "Wi-Fi e BLE integrados." } },
    { q: "O que é o Raspberry Pi?", o: ["Mini-computador", "Microcontrolador", "Sensor"], a: 0, td: { c: "SBC.", e: "Roda Linux completo." } },
    { q: "Qual placa é esta?", image: `<svg viewBox="0 0 100 50"><rect width="100" height="50" fill="#1a1a2e"/><text x="50" y="25" fill="#fff" font-size="10" text-anchor="middle">ESP32</text></svg>`, o: ["ESP32", "Arduino", "Raspberry"], a: 0, td: { c: "DevKit.", e: "Módulo metálico." } }
  ]},
  { id: 6, title: "FreeRTOS", icon: "⏱️", color: "#ce82ff", questions: [
    { q: "O que significa RTOS?", o: ["Real-Time OS", "Rapid Transfer", "Random Time"], a: 0, td: { c: "Tempo real.", e: "Cumpre prazos." } },
    { q: "O que é Hard Real-Time?", o: ["Falha se perder o prazo", "Roda rápido", "Usa muita memória"], a: 0, td: { c: "Ex: airbag.", e: "Prazo é crítico." } }
  ]},
  { id: 7, title: "SONOFF", icon: "💡", color: "#ffc800", questions: [
    { q: "O que é SONOFF?", o: ["Interruptor Wi-Fi", "Roteador", "Servidor"], a: 0, td: { c: "Relé inteligente.", e: "Usa ESP8266." } },
    { q: "O que é Tasmota?", o: ["Firmware open-source", "Um app", "Um protocolo"], a: 0, td: { c: "Alternativa local.", e: "Usa MQTT." } }
  ]}
];
const state = { xp: 0, hearts: 5, currentQuestions: [], currentQuestion: 0, correctCount: 0 };
let errors = JSON.parse(localStorage.getItem('errors') || '[]');
function updateBar(){ document.getElementById('xp').textContent = state.xp; document.getElementById('hearts').textContent = state.hearts; document.getElementById('streak').textContent = state.xp / 10; }
function showScreen(id){ document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function shuffle(a){ return a.sort(() => Math.random() - 0.5); }
function goHome(){
  showScreen('home');
  const list = document.getElementById('modules-list'); list.innerHTML = '';
  MODULES.forEach(m => {
    const div = document.createElement('div'); div.className = 'module';
    div.innerHTML = `<div class="mod-icon" style="background:${m.color}22;color:${m.color}">${m.icon}</div><div><h3>${m.title}</h3><p style="font-size:12px;color:#777">${m.questions.length} questões</p></div>`;
    div.onclick = () => startModule(m);
    list.appendChild(div);
  });
  updateBar();
}
function startModule(mod){
  state.currentQuestions = shuffle([...mod.questions]);
  state.currentQuestion = 0; state.correctCount = 0;
  if(state.hearts <= 0) state.hearts = 5;
  showScreen('lesson'); renderQuestion();
}
function renderQuestion(){
  const q = state.currentQuestions[state.currentQuestion];
  if(!q) return finishLesson();
  document.getElementById('lesson-progress').style.width = (state.currentQuestion / state.currentQuestions.length * 100) + '%';
  let html = `<div class="q-text">${q.q}</div>`;
  if(q.image) html += `<div class="q-image">${q.image}</div>`;
  html += `<div class="options" id="options"></div>`;
  document.querySelector('.question-card').innerHTML = html;
  const opts = shuffle(q.o.map((text, i) => ({ text, isCorrect: i === q.a })));
  q.shuffled = opts;
  opts.forEach((opt, i) => {
    const btn = document.createElement('button'); btn.className = 'opt'; btn.textContent = opt.text;
    btn.onclick = () => checkAnswer(i);
    document.getElementById('options').appendChild(btn);
  });
}
function checkAnswer(idx){
  const q = state.currentQuestions[state.currentQuestion];
  const btns = document.getElementById('options').children;
  Array.from(btns).forEach(b => b.disabled = true);
  const isCorrect = q.shuffled[idx].isCorrect;
  if(isCorrect){
    btns[idx].classList.add('correct'); state.xp += 10; state.correctCount++;
    document.getElementById('fb-title').textContent = '✅ Correto!';
  } else {
    btns[idx].classList.add('wrong');
    btns[q.shuffled.findIndex(o => o.isCorrect)].classList.add('correct');
    state.hearts--; if(!errors.some(e => e.q === q.q)) { errors.push({ q: q.q, td: q.td }); localStorage.setItem('errors', JSON.stringify(errors)); }
    document.getElementById('fb-title').textContent = '❌ Errado!';
  }
  document.getElementById('fb-text').innerHTML = `<strong>Conceito:</strong> ${q.td.c}<br><strong>Explicação:</strong> ${q.td.e}`;
  document.getElementById('feedback').className = 'feedback show ' + (isCorrect ? '' : 'wrong');
  updateBar();
}
function nextQuestion(){ document.getElementById('feedback').className = 'feedback'; state.currentQuestion++; renderQuestion(); }
function finishLesson(){ alert(`Módulo concluído! Acertos: ${state.correctCount}/${state.currentQuestions.length}`); goHome(); }
function openReview(){
  showScreen('review');
  const list = document.getElementById('review-list'); list.innerHTML = '';
  if(errors.length === 0) list.innerHTML = '<p>Você não tem erros. Parabéns!</p>';
  errors.forEach((e, i) => {
    const div = document.createElement('div'); div.className = 'module';
    div.innerHTML = `<div><h3 style="font-size:14px">${e.q}</h3><p style="font-size:12px;color:var(--blue); margin-top:8px">${e.td.c}</p><p style="font-size:12px;margin-top:4px; color:#555">${e.td.e}</p></div>`;
    list.appendChild(div);
  });
}
function openChallenges(){ showScreen('challenges'); }
const COMPS = { esp32: { n: 'ESP32', e: '📡', p: ['3V3', 'GND', 'GPIO2'] }, led: { n: 'LED', e: '💡', p: ['+', '-'] }, res: { n: 'Resistor', e: '🟫', p: ['A', 'B'] } };
function startChallenge(type){
  showScreen('circuit-editor'); document.getElementById('circuit-title').textContent = "Monte o LED";
  const tb = document.getElementById('toolbox'); tb.innerHTML = '';
  ['esp32', 'led', 'res'].forEach(k => {
    const el = document.createElement('div'); el.className = 'tool-item'; el.innerHTML = `<div>${COMPS[k].e}</div><div style="font-size:10px">${COMPS[k].n}</div>`;
    el.onpointerdown = (e) => dragDrop(e, k); tb.appendChild(el);
  });
}
let dragType = null;
function dragDrop(e, k){
  dragType = k; const ghost = document.createElement('div'); ghost.style.cssText = 'position:fixed;pointer-events:none;z-index:999;font-size:30px'; ghost.textContent = COMPS[k].e;
  document.body.appendChild(ghost); const move = (ev) => { ghost.style.left = ev.clientX - 20 + 'px'; ghost.style.top = ev.clientY - 20 + 'px'; }; move(e);
  document.addEventListener('pointermove', move);
  document.onpointerup = (ev) => {
    ghost.remove(); document.removeEventListener('pointermove', move); document.onpointerup = null;
    const rect = document.getElementById('canvas').getBoundingClientRect();
    if(ev.clientX >= rect.left && ev.clientX <= rect.right && ev.clientY >= rect.top && ev.clientY <= rect.bottom){ placeComp(k, ev.clientX - rect.left, ev.clientY - rect.top); }
  };
}
function placeComp(type, x, y){
  const c = COMPS[type]; const el = document.createElement('div'); el.className = 'placed'; el.style.left = x + 'px'; el.style.top = y + 'px';
  let pins = '<div style="display:flex;margin-top:5px">'; c.p.forEach(p => { pins += `<div class="pin" title="${p}"></div>`; }); pins += '</div>';
  el.innerHTML = `<div>${c.e}</div><div style="font-size:10px">${c.n}</div>${pins}`;
  document.getElementById('canvas').appendChild(el);
  el.onpointerdown = (e) => {
    if(e.target.classList.contains('pin')) return;
    const sx = e.clientX, sy = e.clientY, ox = parseFloat(el.style.left), oy = parseFloat(el.style.top);
    const move = (ev) => { el.style.left = ox + ev.clientX - sx + 'px'; el.style.top = oy + ev.clientY - sy + 'px'; };
    document.addEventListener('pointermove', move);
    document.onpointerup = () => { document.removeEventListener('pointermove', move); document.onpointerup = null; };
  };
}
function validateCircuit(){ alert("Simulação: Circuito verificado com sucesso!"); }
goHome();
</script>
</body>
</html>
