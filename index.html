<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Duo — Aprenda Internet das Coisas</title>
<style>
  :root{ --green:#58cc02; --green-dark:#58a700; --blue:#1cb0f6; --blue-dark:#1899d6; --red:#ff4b4b; --yellow:#ffc800; --gray:#e5e5e5; --gray-dark:#afafaf; --bg:#fff; --text:#3c3c3c; --purple:#ce82ff; --orange:#ff9600; }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Nunito',-apple-system,Segoe UI,Roboto,sans-serif}
  body{background:var(--bg);color:var(--text);max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:2px solid var(--gray);position:sticky;top:0;background:#fff;z-index:10}
  .stat{display:flex;align-items:center;gap:6px;font-weight:800;font-size:18px}
  .stat.streak{color:var(--orange)} .stat.gems{color:var(--blue)} .stat.hearts{color:var(--red)} .stat.xp{color:var(--yellow)}
  .topbar-actions{display:flex; gap:8px;}
  .icon-btn{background:none; border:none; font-size:20px; cursor:pointer; padding:4px 6px; border-radius:8px;}
  .screen{display:none;flex:1;padding:20px;flex-direction:column}
  .screen.active{display:flex}
  .home-title{font-size:26px;font-weight:900;margin-bottom:4px} .home-sub{color:#777;font-size:14px;margin-bottom:24px}
  .module{background:#fff;border:2px solid var(--gray);border-radius:16px;padding:16px;margin-bottom:14px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:.2s;position:relative}
  .module:hover{border-color:var(--green);transform:translateY(-2px)} .module.locked{opacity:.55;cursor:not-allowed}
  .module.completed{border-color:var(--green);background:#f0fff0}
  .mod-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
  .mod-info{flex:1} .mod-info h3{font-size:16px;font-weight:800;margin-bottom:4px} .mod-info p{font-size:13px;color:#777}
  .mod-progress{margin-top:6px;height:8px;background:var(--gray);border-radius:4px;overflow:hidden} .mod-progress > div{height:100%;background:var(--green);transition:.4s}
  .lesson-header{display:flex;align-items:center;gap:12px;margin-bottom:20px} .back-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--gray-dark)}
  .lesson-bar{flex:1;height:14px;background:var(--gray);border-radius:7px;overflow:hidden} .lesson-bar > div{height:100%;background:var(--green);transition:.3s}
  .question-card{flex:1;display:flex;flex-direction:column;justify-content:center}
  .q-tag{font-size:12px;font-weight:800;color:var(--blue);text-transform:uppercase;margin-bottom:8px}
  .q-text{font-size:22px;font-weight:800;line-height:1.35;margin-bottom:26px}
  .options{display:flex;flex-direction:column;gap:12px}
  .opt{background:#fff;border:2px solid var(--gray);border-bottom-width:4px;border-radius:14px;padding:16px;font-size:16px;font-weight:700;text-align:left;cursor:pointer;transition:.15s;color:var(--text)}
  .opt:hover:not(:disabled){background:#f7f7f7} .opt.correct{background:#d7ffb8;border-color:var(--green);color:var(--green-dark)}
  .opt.wrong{background:#ffdfe0;border-color:var(--red);color:var(--red)}
  .q-image{background:#f7f7f7;border-radius:16px;padding:16px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;min-height:160px;border:1px solid #e0e0e0}
  .q-image svg{max-width:100%;height:auto;max-height:220px;}
  .feedback{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;padding:16px;background:#d7ffb8;border-top:2px solid var(--green);display:none;z-index:20}
  .feedback.show{display:block} .feedback.wrong{background:#ffdfe0;border-color:var(--red)}
  .feedback h4{font-size:18px;font-weight:900;margin-bottom:4px;color:var(--green-dark)} .feedback.wrong h4{color:var(--red)}
  .feedback p{font-size:14px;color:#555;margin-bottom:12px}
  .btn{width:100%;background:var(--green);color:#fff;border:none;border-bottom:4px solid var(--green-dark);border-radius:14px;padding:16px;font-size:17px;font-weight:800;text-transform:uppercase;cursor:pointer;transition:.1s}
  .btn:active{transform:translateY(2px);border-bottom-width:2px} .btn:disabled{background:var(--gray);border-color:var(--gray-dark);color:var(--gray-dark)}
  .result{text-align:center;justify-content:center;align-items:center;gap:20px}
  .result .big-emoji{font-size:80px} .result h2{font-size:28px;font-weight:900}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:10px}
  .stat-box{background:#fff;border:2px solid var(--gray);border-radius:14px;padding:16px}
  .stat-box .label{font-size:12px;color:#777;font-weight:700;text-transform:uppercase;margin-bottom:6px}
  .stat-box .val{font-size:24px;font-weight:900}
  .review-badge{position:fixed; bottom:20px; right:20px; background:var(--orange); color:#fff; border:none; width:60px; height:60px; border-radius:50%; font-size:24px; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center; z-index:15;}
  .review-badge .count{position:absolute; top:-4px; right:-4px; background:var(--red); color:#fff; font-size:12px; font-weight:900; border-radius:10px; padding:2px 6px;}
  .review-badge.hidden{ display:none; }
  .review-header{display:flex;align-items:center;gap:12px;margin-bottom:16px} .review-title{font-size:22px;font-weight:900}
  .error-card{background:#fff; border:2px solid var(--gray); border-radius:16px; padding:16px; margin-bottom:12px; cursor:pointer;}
  .td-block{border-left:4px solid var(--blue); padding:12px 16px; margin-bottom:16px; background:#f5fbff; border-radius:0 12px 12px 0;}
  .td-block.green{border-color:var(--green); background:#f0fff0;} .td-block.red{border-color:var(--red); background:#fff5f5;}
  .td-block.orange{border-color:var(--orange); background:#fff8f0;}
</style>
</head>
<body>

<div class="topbar">
  <div class="stat streak"><span class="icon">🔥</span><span id="streak">0</span></div>
  <div class="stat gems"><span class="icon">💎</span><span id="gems">0</span></div>
  <div class="stat hearts"><span class="icon">❤️</span><span id="hearts">5</span></div>
  <div class="stat xp"><span class="icon">⚡</span><span id="xp">0</span></div>
</div>

<div id="home" class="screen active">
  <h1 class="home-title">Aprenda IoT 🚀</h1>
  <p class="home-sub">Modo Prova: Questões aleatórias a cada tentativa</p>
  <div id="modules-list"></div>
</div>

<div id="lesson" class="screen">
  <div class="lesson-header">
    <button class="back-btn" onclick="quitLesson()">✕</button>
    <div class="lesson-bar"><div id="lesson-progress" style="width:0%"></div></div>
  </div>
  <div class="question-card"></div>
</div>

<div id="result" class="screen result">
  <div class="big-emoji" id="res-emoji">🎉</div>
  <h2 id="res-title">Lição completa!</h2>
  <div class="stats-grid">
    <div class="stat-box"><div class="label">XP ganho</div><div class="val" id="res-xp" style="color:var(--yellow)">+0</div></div>
    <div class="stat-box"><div class="label">Acertos</div><div class="val" id="res-score" style="color:var(--green)">0/0</div></div>
  </div>
  <button class="btn" onclick="goHome()" style="margin-top:20px">CONTINUAR</button>
</div>

<div class="feedback" id="feedback">
  <h4 id="fb-title">Muito bem!</h4>
  <p id="fb-text"></p>
  <button class="btn" id="fb-btn" onclick="nextQuestion()">CONTINUAR</button>
</div>

<button class="review-badge hidden" id="review-badge" onclick="openReview()">🧠<span class="count" id="review-count">0</span></button>

<div id="review" class="screen">
  <div class="review-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <div class="review-title">🧠 Caderno de Erros</div>
  </div>
  <p style="font-size:12px;color:#777;margin-bottom:16px">Estude a engenharia reversa dos seus erros.</p>
  <div id="review-list"></div>
</div>

<div id="topdown" class="screen">
  <div class="review-header">
    <button class="back-btn" onclick="openReview()">←</button>
    <div class="review-title">🔍 Dissecação</div>
  </div>
  <div id="td-content"></div>
</div>

<script>
// BANCO DE QUESTÕES COMPLETO E EXPANDIDO (Módulos 1 a 8)
const MODULES = [
  {
    id: 1, title: "Fundamentos de IoT", icon: "🌐", color: "#1cb0f6", desc: "O que é, história e aplicações",
    lessons: [{
      title: "Introdução", questions: [
        { q: "Quem cunhou o termo 'Internet das Coisas' em 1999?", o: ["Kevin Ashton", "Steve Jobs", "Tim Berners-Lee", "Bill Gates"], a: 0, exp: "Kevin Ashton, no MIT, usou o termo em 1999.", td: { conceito: "IoT nasceu do RFID no MIT.", dissecao: "Testa o nome do 'pai' da IoT.", porqueErrada: "Jobs/Gates são da computação pessoal.", porqueCerta: "Kevin Ashton usou 'IoT' em 1999." } },
        { q: "IoT significa literalmente:", o: ["Internet of Things", "Internet of Transmissions", "Interconnected Objects Technology", "Integrated Online Things"], a: 0, exp: "Internet of Things.", td: { conceito: "Sigla internacional em inglês.", dissecao: "Vocabulário exato da sigla.", porqueErrada: "Alternativas inventam termos falsos.", porqueCerta: "Internet of Things." } },
        { q: "Qual o principal objetivo da IoT?", o: ["Conectar objetos à internet para trocar dados", "Substituir a internet tradicional", "Criar redes sociais", "Apenas armazenar dados"], a: 0, exp: "Conectar objetos do dia a dia.", td: { conceito: "Extensão da internet para o físico.", dissecao: "Pede o objetivo principal.", porqueErrada: "Nuvem é consequência.", porqueCerta: "Trocar dados entre objetos e usuários." } }
      ]
    }]
  },
  {
    id: 2, title: "Arquiteturas & Cloud", icon: "☁️", color: "#ce82ff", desc: "Camadas, Fog e Edge",
    lessons: [{
      title: "Camadas", questions: [
        { q: "Qual a camada mais baixa da arquitetura IoT?", o: ["Percepção (sensores)", "Aplicação", "Rede", "Negócios"], a: 0, exp: "A camada de percepção.", td: { conceito: "Arquitetura: percepção, rede, aplicação.", dissecao: "Camada que toca o mundo físico.", porqueErrada: "Aplicação fica no topo.", porqueCerta: "Percepção/sensores é a base." } },
        { q: "Onde processar dados se precisar de respostas ultra-rápidas?", o: ["Na Edge (borda)", "Na Cloud", "No Fog", "No browser"], a: 0, exp: "Edge Computing.", td: { conceito: "Trade-off Cloud x Fog x Edge.", dissecao: "Menor latência possível.", porqueErrada: "Cloud tem ida e volta (latência).", porqueCerta: "Edge processa no hardware local." } }
      ]
    }]
  },
  {
    id: 3, title: "Comunicação Sem Fio", icon: "📡", color: "#58cc02", desc: "WiFi, LoRa, Zigbee",
    lessons: [{
      title: "Tecnologias", questions: [
        { q: "Maior alcance em área urbana (~10 km) e baixo consumo?", o: ["LoRa", "WiFi", "Bluetooth", "Zigbee"], a: 0, exp: "LoRa.", td: { conceito: "Trade-off: alcance x consumo x velocidade.", dissecao: "Longo alcance + baixo consumo.", porqueErrada: "WiFi/BT têm alcance curto.", porqueCerta: "LoRa atinge 10km com baixíssimo consumo." } },
        { q: "Qual NÃO é tecnologia de transmissão IoT?", o: ["HTML5", "Zigbee", "NB-IoT", "SigFox"], a: 0, exp: "HTML5 é marcação.", td: { conceito: "Transmissão opera no rádio.", dissecao: "Três são rádios, uma é linguagem.", porqueErrada: "HTML5 não transmite bits por rádio.", porqueCerta: "Zigbee, NB-IoT e SigFox são rádios." } }
      ]
    }]
  },
  {
    id: 4, title: "Protocolos", icon: "🔌", color: "#ff9600", desc: "MQTT, CoAP, HTTP",
    lessons: [{
      title: "MQTT", questions: [
        { q: "O MQTT usa qual modelo?", o: ["Publish/Subscribe", "Cliente/Servidor", "Broadcast", "Multicast"], a: 0, exp: "Pub/Sub com broker.", td: { conceito: "Desacopla quem envia de quem recebe.", dissecao: "Modelo de mensageria.", porqueErrada: "Cliente/Servidor é HTTP.", porqueCerta: "Pub/Sub via broker." } },
        { q: "O que QoS 0 significa?", o: ["No máximo 1 vez", "Exatamente 1 vez", "Pelo menos 1 vez", "Sem garantia"], a: 0, exp: "Até 1 vez, sem confirmação.", td: { conceito: "MQTT define 3 níveis de QoS.", dissecao: "Nível mais baixo.", porqueErrada: "QoS 2 é exatamente 1.", porqueCerta: "Envia uma vez e esquece." } }
      ]
    }]
  },
  {
    id: 5, title: "Segurança", icon: "🔒", color: "#ff4b4b", desc: "Riscos e proteção",
    lessons: [{
      title: "Riscos", questions: [
        { q: "Garante que dados só sejam lidos por terminais corretos?", o: ["Confidencialidade", "Disponibilidade", "Integridade", "Autenticidade"], a: 0, exp: "Confidencialidade.", td: { conceito: "Pilares CIDA.", dissecao: "Verbo 'ler' aponta para sigilo.", porqueErrada: "Integridade é não alteração.", porqueCerta: "Confidencialidade garante sigilo." } },
        { q: "Ataque que intercepta tráfego entre dispositivo e nuvem?", o: ["Man-in-the-Middle", "Phishing", "SQL Injection", "Brute Force"], a: 0, exp: "MITM.", td: { conceito: "Atacante 'no meio'.", dissecao: "Interceptar tráfego.", porqueErrada: "Phishing engana. SQL ataca banco.", porqueCerta: "MITM lê e altera mensagens." } }
      ]
    }]
  },
  {
    id: 6, title: "Hardware (ESP32)", icon: "🔧", color: "#1cb0f6", desc: "Placas e sensores",
    lessons: [{
      title: "ESP32 e Componentes", questions: [
        { q: "O ESP32 é baseado em qual microprocessador?", o: ["Tensilica Xtensa LX6", "ARM Cortex-A53", "Intel Core i5", "Broadcom BCM2835"], a: 0, exp: "Xtensa LX6 dual-core.", td: { conceito: "ESP32 = Xtensa LX6.", dissecao: "Arquitetura do chip.", porqueErrada: "Cortex é Raspberry.", porqueCerta: "Xtensa LX6 dual-core." } },
        { q: "O ESP32 possui Bluetooth integrado?", o: ["Sim, 4.2 BLE", "Não", "Apenas módulo externo", "Somente 5.0"], a: 0, exp: "Sim, 4.2 BLE.", td: { conceito: "ESP32 tem Wi-Fi + BT.", dissecao: "Integração nativa no chip.", porqueErrada: "Não precisa de módulo.", porqueCerta: "Bluetooth 4.2 + BLE nativo." } },
        { q: "Qual placa está representada acima?", image: `<svg viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg"><rect x="40" y="30" width="220" height="120" rx="6" fill="#1a1a2e" stroke="#0f0f1e" stroke-width="2"/><rect x="60" y="50" width="60" height="40" fill="#333" rx="2"/><text x="90" y="75" text-anchor="middle" fill="#aaa" font-size="10">ESP-WROOM</text><rect x="60" y="100" width="80" height="20" rx="2" fill="#c9a227"/></svg>`, o: ["ESP32 DevKit", "Raspberry Pi 4", "Arduino Uno", "SONOFF Mini"], a: 0, exp: "Módulo ESP-WROOM-32 e GPIO dourado.", td: { conceito: "ESP32 DevKit tem módulo metálico ESP-WROOM.", dissecao: "3 pistas: ESP-WROOM, GPIO, USB.", porqueErrada: "Raspberry tem 40 pinos.", porqueCerta: "É a ESP32 DevKit." } }
      ]
    }]
  },
  {
    id: 7, title: "FreeRTOS", icon: "⏱️", color: "#ce82ff", desc: "Sistema de tempo real",
    lessons: [{
      title: "Conceitos", questions: [
        { q: "RTOS significa:", o: ["Real-Time Operating System", "Rapid Transfer", "Remote Task", "Random Time"], a: 0, exp: "Real-Time.", td: { conceito: "SO com prazos (deadlines).", dissecao: "Sigla exata.", porqueErrada: "Siglas inventadas.", porqueCerta: "Real-Time Operating System." } },
        { q: "Hard Real-Time falha quando:", o: ["O prazo não é cumprido", "O Wi-Fi cai", "A memória enche", "O código tem bug"], a: 0, exp: "Perder deadline = falha total.", td: { conceito: "Hard, Firm, Soft.", dissecao: "Airbag é exemplo clássico.", porqueErrada: "Wi-Fi e memória não são deadlines.", porqueCerta: "Hard RT perder prazo inutiliza." } }
      ]
    }]
  },
  {
    id: 8, title: "SONOFF", icon: "💡", color: "#ffc800", desc: "Interruptores Wi-Fi",
    lessons: [{
      title: "O que é", questions: [
        { q: "SONOFF fabrica que tipo de dispositivo?", o: ["Interruptores Wi-Fi", "Roteadores", "Servidores", "Câmeras"], a: 0, exp: "Interruptores Wi-Fi.", td: { conceito: "SONOFF = relés inteligentes.", dissecao: "Categoria do produto.", porqueErrada: "Não roteiam IP.", porqueCerta: "Interruptores Wi-Fi acessíveis." } },
        { q: "Qual chip equipa a maioria dos SONOFF Wi-Fi?", o: ["ESP8266", "ESP32", "BCM2835", "CC2530"], a: 0, exp: "ESP8266.", td: { conceito: "Linha Wi-Fi = ESP8266.", dissecao: "Chip majoritário.", porqueErrada: "ESP32 é mais caro.", porqueCerta: "ESP8266." } }
      ]
    }]
  }
];

const state = { xp: 0, gems: 0, hearts: 5, streak: 0, completed: {}, currentModule: null, currentLesson: 0, currentQuestions: [], currentQuestion: 0, correctCount: 0, answered: false };
const errorState = { errors: [] };

function $(id){ return document.getElementById(id); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); }
function updateTopBar(){ $('streak').textContent = state.streak; $('gems').textContent = state.gems; $('hearts').textContent = state.hearts; $('xp').textContent = state.xp; }
function saveState(){ localStorage.setItem('iot-duo', JSON.stringify(state)); }
function loadState(){ try{ const s = JSON.parse(localStorage.getItem('iot-duo')); if(s) Object.assign(state, s); }catch(e){} updateTopBar(); }

// EMBARALHAR QUESTÕES E OPÇÕES (FISHER-YATES)
function shuffleArray(array) {
  const newArr = [...array];
  for (let i = newArr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
  }
  return newArr;
}

function renderModules(){
  const list = $('modules-list'); list.innerHTML = '';
  MODULES.forEach((mod, idx) => {
    const done = state.completed[mod.id] || [];
    const pct = (done.length / mod.lessons.length) * 100;
    const completed = done.length === mod.lessons.length;
    const div = document.createElement('div');
    div.className = 'module' + (completed ? ' completed' : '');
    div.innerHTML = `<div class="mod-icon" style="background:${mod.color}22;color:${mod.color}">${mod.icon}</div><div class="mod-info"><h3>${mod.title}</h3><p>${mod.desc}</p><div class="mod-progress"><div style="width:${pct}%"></div></div></div>`;
    div.onclick = () => startModule(mod.id);
    list.appendChild(div);
  });
}

function startModule(modId){
  const mod = MODULES.find(m => m.id === modId);
  // AQUI ACONTECE A MÁGICA: Embaralha as questões antes de começar!
  let allQuestions = [];
  mod.lessons.forEach(l => allQuestions = allQuestions.concat(l.questions));
  
  state.currentModule = modId; 
  state.currentQuestions = shuffleArray(allQuestions); // Embaralha
  state.currentQuestion = 0; 
  state.correctCount = 0; 
  state.answered = false;
  
  if(state.hearts <= 0){ state.hearts = 5; updateTopBar(); }
  showScreen('lesson'); renderQuestion();
}

function renderQuestion(){
  const q = state.currentQuestions[state.currentQuestion];
  if(!q){ finishLesson(); return; }
  
  const qc = document.querySelector('.question-card');
  let inner = `<div class="q-tag">Questão ${state.currentQuestion + 1} de ${state.currentQuestions.length}</div>`;
  if(q.image) inner += `<div class="q-image">${q.image}</div>`;
  inner += `<div class="q-text">${q.q}</div><div class="options" id="options"></div>`;
  qc.innerHTML = inner;
  
  $('lesson-progress').style.width = ((state.currentQuestion) / state.currentQuestions.length * 100) + '%';
  
  // Embaralha também as opções de resposta
  let opts = q.o.map((text, i) => ({ text, isCorrect: i === q.a }));
  opts = shuffleArray(opts); 
  
  // Guarda a resposta correta embaralhada
  state.currentQuestions[state.currentQuestion].shuffledOpts = opts;
  
  opts.forEach((opt, i) => {
    const btn = document.createElement('button'); 
    btn.className = 'opt'; 
    btn.textContent = opt.text; 
    btn.onclick = () => selectAnswer(i); 
    $('options').appendChild(btn);
  });
  state.answered = false;
}

function selectAnswer(idx){
  if(state.answered) return; state.answered = true;
  const q = state.currentQuestions[state.currentQuestion];
  const opts = $('options').children;
  Array.from(opts).forEach(b => b.disabled = true);
  
  const isCorrect = q.shuffledOpts[idx].isCorrect;

  if(isCorrect){
    opts[idx].classList.add('correct'); state.correctCount++; state.xp += 10; state.gems += 1; updateTopBar(); showFeedback(true, q.exp);
  } else {
    opts[idx].classList.add('wrong'); 
    // Encontra a correta para marcar de verde
    const correctIdx = q.shuffledOpts.findIndex(o => o.isCorrect);
    opts[correctIdx].classList.add('correct'); 
    
    state.hearts = Math.max(0, state.hearts - 1); updateTopBar();
    if(!errorState.errors.some(e => e.q === q.q)){
      errorState.errors.push({ q: q.q, wrong: q.shuffledOpts[idx].text, right: q.o[q.a], exp: q.exp, td: q.td });
      localStorage.setItem('iot-duo-errors', JSON.stringify(errorState.errors));
      updateReviewBadge();
    }
    showFeedback(false, q.exp);
  }
  saveState();
}

function showFeedback(correct, exp){
  const fb = $('feedback'); fb.className = 'feedback show' + (correct ? '' : ' wrong');
  $('fb-title').textContent = correct ? '✅ Muito bem!' : '❌ Quase!';
  $('fb-text').textContent = exp; $('fb-btn').textContent = correct ? 'CONTINUAR' : 'ENTENDI';
}
function nextQuestion(){ $('feedback').classList.remove('show'); if(state.currentQuestion + 1 < state.currentQuestions.length){ state.currentQuestion++; renderQuestion(); } else { finishLesson(); } }

function finishLesson(){
  const mod = MODULES.find(m => m.id === state.currentModule);
  if(!state.completed[mod.id]) state.completed[mod.id] = [];
  if(!state.completed[mod.id].includes(0)) state.completed[mod.id].push(0); // Marca lição como feita
  saveState();
  $('res-emoji').textContent = state.correctCount === state.currentQuestions.length ? '🏆' : '🎉';
  $('res-xp').textContent = '+' + (state.correctCount * 10);
  $('res-score').textContent = `${state.correctCount}/${state.currentQuestions.length}`;
  showScreen('result');
}
function quitLesson(){ showScreen('home'); renderModules(); }
function goHome(){ showScreen('home'); renderModules(); }

function updateReviewBadge(){ const n = errorState.errors.length; if(n > 0){ $('review-badge').classList.remove('hidden'); $('review-count').textContent = n; } else { $('review-badge').classList.add('hidden'); } }
function loadErrors(){ try{ const e = JSON.parse(localStorage.getItem('iot-duo-errors')); if(e) errorState.errors = e; }catch(e){} updateReviewBadge(); }

function openReview(){ showScreen('review'); renderErrorList(); }
function renderErrorList(){
  const list = $('review-list'); list.innerHTML = '';
  if(errorState.errors.length === 0){ list.innerHTML = `<div style="text-align:center;padding:40px;color:#777"><h3>Nenhum erro!</h3></div>`; return; }
  errorState.errors.forEach((err, i) => {
    const card = document.createElement('div'); card.className = 'error-card';
    card.innerHTML = `<div style="font-weight:700; font-size:15px;">${err.q}</div>`;
    card.onclick = () => startTopDown(i);
    list.appendChild(card);
  });
}

function startTopDown(idx){ errorState.currentReviewIdx = idx; renderTopDown(); showScreen('topdown'); }
function renderTopDown(){
  const err = errorState.errors[errorState.currentReviewIdx]; if(!err) return openReview();
  const td = err.td || { conceito: "Conceito central.", dissecao: "A questão testa um ponto específico.", porqueErrada: `"${err.wrong}" é uma armadilha.`, porqueCerta: `"${err.right}" está correta.` };
  
  $('td-content').innerHTML = `
    <div class="q-text" style="font-size:18px;">${err.q}</div>
    <div class="td-block red"><div style="font-size:11px;font-weight:900;color:var(--red)">❌ SUA RESPOSTA</div>${err.wrong}</div>
    <div class="td-block green"><div style="font-size:11px;font-weight:900;color:var(--green-dark)">✅ CORRETA</div>${err.right}</div>
    <div class="td-block"><div style="font-size:11px;font-weight:900;color:var(--blue)">🔭 CONCEITO</div><p style="margin-top:6px;">${td.conceito}</p></div>
    <div class="td-block orange"><div style="font-size:11px;font-weight:900;color:var(--orange)">🧩 DISSECAÇÃO</div><p style="margin-top:6px;">${td.dissecao}</p></div>
    <div class="td-block red"><div style="font-size:11px;font-weight:900;color:var(--red)">❌ POR QUE ERROU</div><p style="margin-top:6px;">${td.porqueErrada}</p></div>
    <div class="td-block green"><div style="font-size:11px;font-weight:900;color:var(--green-dark)">✅ POR QUE ESTÁ CERTA</div><p style="margin-top:6px;">${td.porqueCerta}</p></div>
    <button class="btn" style="margin-top:20px;" onclick="removeError()">ENTENDI, APAGAR ERRO ✓</button>
  `;
}
function removeError(){
  errorState.errors.splice(errorState.currentReviewIdx, 1);
  localStorage.setItem('iot-duo-errors', JSON.stringify(errorState.errors));
  updateReviewBadge(); openReview();
}

loadState(); loadErrors(); renderModules();
</script>
</body>
</html>
